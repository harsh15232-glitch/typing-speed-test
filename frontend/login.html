<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Keystroke</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .auth-shell { max-width: 420px; margin: 8vh auto; padding: 0 20px; }
  .auth-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-elevated); }
  .auth-card h2 { margin-top: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .field input {
    font-family: var(--font-mono); background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 12px 14px; border-radius: var(--radius-sm); outline: none; font-size: 14px;
  }
  .field input:focus { border-color: var(--accent); }
  .auth-error { color: var(--error); font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .auth-card .btn-primary { width: 100%; padding: 13px; }
</style>
</head>
<body>
<div class="auth-shell">
  <div class="brand" style="justify-content:center; margin-bottom:22px;"><span class="dot"></span> Keystroke</div>
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="muted" style="margin-top:-8px;">Sign in to sync your stats and join multiplayer races.</p>
    <form id="loginForm">
      <div class="field">
        <label for="identifier">Username or email</label>
        <input type="text" id="identifier" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <div class="auth-error" id="authError"></div>
      <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
    <div class="auth-switch">No account? <a href="register.html" style="color:var(--accent);">Create one</a></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const identifier = document.getElementById("identifier").value.trim();
    const password = document.getElementById("password").value;
    const errBox = document.getElementById("authError");
    errBox.textContent = "";
    try {
      await Auth.loginUser({ identifier, password });
      window.location.href = "index.html";
    } catch (err) {
      errBox.textContent = err.message || "Login failed. Check the backend is running.";
    }
  });
</script>
</body>
</html>
